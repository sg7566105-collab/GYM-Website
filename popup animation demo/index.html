<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .popup {
            width: 400px;
            background: #111;
            color: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, .45);
            position: relative;
            text-align: center;
            animation: popup .35s ease;
        }

        .popup h2 {
            font-size: 2rem;
            margin-bottom: 18px;
        }

        .popup p {
            color: #cfcfcf;
            line-height: 1.7;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .close {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 28px;
            cursor: pointer;
            color: white;
            transition: .3s;
        }

        .close:hover {
            color: #ff3b3b;
            transform: rotate(90deg);
        }

        .start-btn {
            padding: 14px 32px;
            border-radius: 50px;
            border: 1px solid #BFA46F;
            background: #111;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 15px rgba(191, 164, 111, .18);
        }

        .start-btn:hover {
            background: #BFA46F;
            color: #111;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(191, 164, 111, .35);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes popup {

            from {
                opacity: 0;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }
    </style>
</head>

<body>
    <div class="overlay">
        <div class="popup">

            <span class="close">&times;</span>

            <h2>💪 Strength Training</h2>

            <p>
                Build muscle, increase strength, and improve your overall fitness with personalized workout plans,
                expert
                coaching, and continuous progress tracking.
            </p>

            <button class="start-btn">
                Start Program
            </button>

        </div>
    </div>
</body>

</html>
